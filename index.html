<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance Websocket</title>
    <script>
      const WS_URL =
        location.protocol === "https:"
          ? "wss://websocket-binance.onrender.com"
          : "ws://localhost:8080";

      const ws = new WebSocket(WS_URL);
      ws.onmessage = (e) => {
        // The data is per troy ounce. 1 troy ounce * 32.1507 = 1 kg
        const data = JSON.parse(e.data).price;
        const TROY_OUNCE_TO_KG = 32.1507;
        const usdPrice = document.getElementById("usd-price");
        usdPrice.innerText = `\$${Math.round(data * TROY_OUNCE_TO_KG)}`;
        const USD_TO_INR = 90.4; // find if you can update this in live time
        const inrPrice = document.getElementById("inr-price");
        inrPrice.innerText = `\₹${Math.round(data * USD_TO_INR * TROY_OUNCE_TO_KG)}`;
      };
    </script>
  </head>
  <body
    style="
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      background-color: lightblue;
    "
  >
    <h1
      style="
        background-color: darkblue;
        padding: 1rem;
        color: mistyrose;
        width: fit-content;
        border-radius: 10px;
      "
    >
      <span style="color: rgb(182, 182, 182)"> Silver </span> prices (round fig)
      per kg:
    </h1>
    <div style="display: flex; align-items: center">
      <h2 style="color: darkblue; display: inline; margin-right: 1rem">
        USD $$$
      </h2>
      <p
        style="
          background-color: darkblue;
          width: fit-content;
          color: mistyrose;
          padding: 1rem;
          display: inline;
          border-radius: 10px;
        "
        id="usd-price"
      >
        Loading...
      </p>
    </div>
    <div style="display: flex; align-items: center">
      <h2 style="color: darkblue; display: inline; margin-right: 1rem">
        INR ₹₹₹
      </h2>
      <p
        style="
          background-color: darkblue;
          width: fit-content;
          color: mistyrose;
          padding: 1rem;
          display: inline;
          border-radius: 10px;
        "
        id="inr-price"
      >
        Loading...
      </p>
    </div>
  </body>
</html>
